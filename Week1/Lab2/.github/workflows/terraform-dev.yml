name: "Terraform Dev Pipeline"

on:
  push:
    branches:
      - main
    paths:
      - "environments/dev/**"
      - "modules/**"
  pull_request:
    branches:
      - main
    paths:
      - "environments/dev/**"
      - "modules/**"
  workflow_dispatch:

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read
  pull-requests: write

jobs:
  # LEVEL 1: CHECKS, VALIDATIONS & DEVSECOPS SCANS
  validate_and_plan:
    name: "Level 1: Dev Lint, Validate & Security Scan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS Credentials (OIDC Role or Secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: 1. Code Formatting Check
        run: terraform fmt -check -recursive ../..

      - name: 2. Terraform Init
        run: terraform init

      - name: 3. Terraform Validate
        run: terraform validate

      - name: 4. DevSecOps Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "./environments/dev"
          exit-code: "0"
          severity: "HIGH,CRITICAL"

      - name: 5. Terraform Plan
        id: plan
        run: terraform plan -no-color

      # Post Plan Output to PR Comments for Peer Review
      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `### Level 1 Check Result: Dev Environment 🛠️
            - **Formatting Check**: Pass ✅
            - **Syntax & Provider Validation**: Pass ✅
            - **DevSecOps Security Scan**: Complete 🛡️
            
            <details><summary>Show Terraform Plan</summary>

            \`\`\`hcl
            ${process.env.PLAN_OUTPUT}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
        env:
          PLAN_OUTPUT: "${{ steps.plan.outputs.stdout }}"

  # LEVEL 2: DEV DEPLOYMENT
  deploy_dev:
    name: "Level 2: Dev Deploy & Verification"
    needs: validate_and_plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development
    defaults:
      run:
        working-directory: ./environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configure AWS Credentials (OIDC Role or Secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Post-Deployment Dev Verification
        run: |
          echo "=== Post-Deployment Dev Verification ==="
          terraform output
